<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Burger Website</title>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="burger.css">
    </head>
    <body>
        <!--Navbar-->
        <header>
            <a href="#" class="logo">R-Burger</a>
            <div class="bx bx-menu" id="menu-icon"></div>

            <ul class="navbar">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#services">Service</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </header>
        <!--Home Section-->
        <section class="home" id="home">
            <div class="home-text">
                <h1>Burger Taste</h1>
                <h2>The tasty burger of <br> your choice</h2>
                <a href="#" class="btn">View Menu</a>
            </div>
            <div class="home-img">
                <img src="img/home.png" alt="">
            </div>
        </section>

        <!--About-->
        <section class="about" id="about">
            <div class="about-img">
                <img src="img/about.jpg" alt="">
            </div>
            <div class="about-text">
                <span>About Us</span>
                <h2>We make good and <br> tasty burger</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vestibulum posuere arcu, non bibendum metus pretium sit amet.</p>
                <a href="#" class="btn">Learn More</a>
            </div>
        </section>

        <script src="burger.js"></script>
    </body>
</html>
